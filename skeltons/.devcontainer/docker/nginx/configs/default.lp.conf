# NOTE: TLS is terminated by the shared reverse proxy (Traefik), and requests are forwarded to
#       this Nginx via HTTP. So pass the original scheme (X-Forwarded-Proto) to PHP as `HTTPS`.
map $http_x_forwarded_proto $fastcgi_https {
  default "";
  https   on;
}

server {
  listen      80 default_server;
  listen      [::]:80 default_server;
  server_name {! $site_domain !};
  root        /var/www/{! $code_name !}/public;

  charset       UTF-8;
  server_tokens off;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;

  client_max_body_size 20M;
  fastcgi_read_timeout 180;

  gzip            on;
  gzip_min_length 1024;
  gzip_types      text/css
                  application/javascript
                  application/json;

  location = /robots.txt {
    access_log off;
    log_not_found off;
  }

  location = /favicon.ico {
    access_log off;
    log_not_found off;
  }

  location / {
    index     web.php;
    try_files $uri $uri/ /web.php?$query_string;
  }

  location ~ \.php$ {
    try_files     $uri =404;
    fastcgi_pass  php-fpm:9000;
    fastcgi_index web.php;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS           $fastcgi_https if_not_empty;
  }
}
