#==================================================================================================
# Rebet Application Docker Compose Settings for Local Development
#==================================================================================================
# Please rewrite the settings according to your development status.
#
# If you want to get other default setting samples of configuration file, try check here.
# https://github.com/rebet/rebet/tree/master/skeltons/.devcontainer/docker
#
version: '3'
networks:
  internal:
    internal: true
  rebet.local:
    external: true
volumes:
  db:      # DB data storage volumes for local development.
  db4ut:   # DB data storage volumes for unit test.
  work4ut: # Working file storage volumes for unit test.
services:
  
  # ---------------------------------------------------------------------------
  # Workspace for Dev Container Development
  # ---------------------------------------------------------------------------
  workspace:
    hostname: {! $code_name !}-workspace
    build:
      context: ./docker/workspace
    environment:
      TZ: {! $timezone !}
    networks:
      internal: {}
      rebet.local: {}
    volumes:
      - ../:/workspace
      - ../app:/var/www/{! $code_name !}
      - ./docker/workspace/config/php.ini:/usr/local/etc/php/php.ini
      - ./docker/workspace/config/mailhog.ini:/usr/local/etc/php/conf.d/mailhog.ini
      - ./docker/workspace/config/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      - ./docker/workspace/config/.bash_aliases:/home/vscode/.bash_aliases
    working_dir: /workspace
    tty: true

  # ---------------------------------------------------------------------------
  # Nginx Settings
  # ---------------------------------------------------------------------------
  nginx:
    hostname: {! $code_name !}-nginx
    build: 
      context: ./docker/nginx/
    restart: always
    networks:
      internal: {}
      rebet.local: {}
    volumes:
      - ../:/workspace
      - ../app:/var/www/{! $code_name !}
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "{! $http_port !}:80"
      - "{! $https_port !}:443"
  
  # ---------------------------------------------------------------------------
  # PHP-FPM Settings
  # ---------------------------------------------------------------------------
  php-fpm:
    hostname: {! $code_name !}-php-fpm
    build: ./docker/php-fpm/
    volumes:
      - ../:/workspace
      - ../app:/var/www/{! $code_name !}
      - work4ut:/workspace/tests/work
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/php.ini
      #{%-- if $use_db && $database == 'sqlite' -%}
      - db:/tmp/sqlite
      - db4ut:/tmp/sqlite4ut
      #{%-- endif -%}
    working_dir: /workspace
  
  #{%-- if $use_db -%}
  #{%-- if $database == 'sqlite' -%}
  # ---------------------------------------------------------------------------
  # SQLite 3 for Local Development Settings
  # ---------------------------------------------------------------------------
  sqlite:
    hostname: {! $code_name !}-sqlite
    build: ./docker/sqlite/
    environment:
      SQLITE_DATABASE: '{! $db_name !}.db'
      SQLITE_CREATE_TABLES: initdb.d/create_tables.sql
    volumes:
      - db:/tmp/sqlite
    tty: true

  # ---------------------------------------------------------------------------
  # SQLite 3 for Unit Test Settings
  # ---------------------------------------------------------------------------
  sqlite4ut:
    hostname: {! $code_name !}-sqlite4ut
    build: ./docker/sqlite/
    environment:
      SQLITE_DATABASE: '{! $db_name !}.db'
      SQLITE_CREATE_TABLES: initdb.d/create_tables.sql
    volumes:
      - db4ut:/tmp/sqlite
    tty: true
  
  #{%-- endif -%}
  #{%-- if $database == 'mysql' -%}
  # ---------------------------------------------------------------------------
  # MySQL for Local Development Settings
  # ---------------------------------------------------------------------------
  mysql:
    hostname: {! $code_name !}-mysql
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd
    volumes:
      - db:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf.d:/etc/mysql/conf.d

  # ---------------------------------------------------------------------------
  # MySQL for Unit Test Settings
  # ---------------------------------------------------------------------------
  mysql4ut:
    hostname: {! $code_name !}-mysql4ut
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd
    volumes:
      - db4ut:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
  
  #{%-- endif -%}
  #{%-- if $database == 'mariadb' -%}
  # ---------------------------------------------------------------------------
  # MariaDB for Local Development Settings
  # ---------------------------------------------------------------------------
  mariadb:
    hostname: {! $code_name !}-mariadb
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd
    volumes:
      - db:/var/lib/mysql
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d
  
  # ---------------------------------------------------------------------------
  # MariaDB for Unit Test Settings
  # ---------------------------------------------------------------------------
  mariadb4ut:
    hostname: {! $code_name !}-mariadb4ut
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd
    volumes:
      - db4ut:/var/lib/mysql
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d
  
  #{%-- endif -%}
  #{%-- if $database == 'pgsql' -%}
  # ---------------------------------------------------------------------------
  # PostgreSQL for Local Development Settings
  # ---------------------------------------------------------------------------
  pgsql:
    hostname: {! $code_name !}-pgsql
    image: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: P@ssw0rd
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - db:/var/lib/postgresql/data
      - ./docker/pgsql/initdb.d:/docker-entrypoint-initdb.d
  
  # ---------------------------------------------------------------------------
  # PostgreSQL for Unit Test Settings
  # ---------------------------------------------------------------------------
  pgsql4ut:
    hostname: {! $code_name !}-pgsql4ut
    image: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: P@ssw0rd
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - db4ut:/var/lib/postgresql/data
      - ./docker/pgsql/initdb.d:/docker-entrypoint-initdb.d
  
  #{%-- endif -%}
  #{%-- if $database != 'sqlite' -%}
  # ---------------------------------------------------------------------------
  # Adminer (Database Management Tool) Settings
  # ---------------------------------------------------------------------------
  # You can access Adminer via `https://{! $site_domain !}/adminer/`.
  adminer:
    hostname: {! $code_name !}-adminer
    image: adminer:latest
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: "{! $database !}"
      ADMINER_DESIGN: hever        # see https://www.adminer.org/#extras, https://github.com/vrana/adminer/tree/master/designs
      ADMINER_PLUGINS: enum-option # see https://www.adminer.org/en/plugins/
  
  #{%-- endif -%}
  #{%-- endif -%}
  #{%-- if $use_cache -%}
  #{%-- if $cache == 'memcached' -%}
  # ---------------------------------------------------------------------------
  # Memcached Settings
  # ---------------------------------------------------------------------------
  memcached:
    hostname: {! $code_name !}-memcached
    image: memcached
  
  #{%-- endif -%}
  #{%-- if $cache == 'redis' -%}
  # ---------------------------------------------------------------------------
  # Redis Settings
  # ---------------------------------------------------------------------------
  redis:
    hostname: {! $code_name !}-redis
    image: redis
  
  #{%-- endif -%}
  #{%-- endif -%}
