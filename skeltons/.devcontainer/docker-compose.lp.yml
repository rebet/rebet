#==================================================================================================
# Rebet Application Docker Compose Settings for Local Development
#==================================================================================================
# Please rewrite the settings according to your development status.
#
# If you want to get other default setting samples of configuration file, try check here.
# https://github.com/rebet/rebet/tree/master/skeltons/.devcontainer/docker
#
# NOTE: Requests are routed to this application by the shared reverse proxy (Traefik) according
#       to the domain '{! $site_domain !}'. Traefik is launched by '.devcontainer/initialize_command.sh'
#       and joins the shared network 'traefik-public', so only the services that Traefik routes to
#       (and that have 'traefik.enable' label) join the shared network.
#       Other services communicate each other via the 'default' network of this application.
#
name: {! $code_name !}
networks:
  default: {}
  traefik-public:
    external: true
volumes:
  db:      # DB data storage volumes for local development.
  db4ut:   # DB data storage volumes for unit test.
  work4ut: # Working file storage volumes for unit test.
services:

  # ---------------------------------------------------------------------------
  # Workspace for Dev Container Development
  # ---------------------------------------------------------------------------
  workspace:
    hostname: {! $code_name !}-workspace
    build:
      context: ./docker/workspace
    environment:
      TZ: {! $timezone !}
    volumes:
      - ../:/workspace
      - ../app:/var/www/{! $code_name !}
      - work4ut:/workspace/tests/work
      - ./docker/workspace/configs/php.ini:/usr/local/etc/php/php.ini
      - ./docker/workspace/configs/mailpit.ini:/usr/local/etc/php/conf.d/mailpit.ini
      - ./docker/workspace/configs/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      - ./docker/workspace/configs/.bash_aliases:/home/vscode/.bash_aliases
      #{%-- if $use_db && $database == 'sqlite' -%}
      - db:/tmp/sqlite
      - db4ut:/tmp/sqlite4ut
      #{%-- endif -%}
    working_dir: /workspace
    tty: true

  # ---------------------------------------------------------------------------
  # Nginx Settings
  # ---------------------------------------------------------------------------
  # You can access this application via `https://{! $site_domain !}/`.
  # (TLS is terminated by Traefik, so Nginx only listens HTTP in the docker network)
  nginx:
    hostname: {! $code_name !}-nginx
    build:
      context: ./docker/nginx/
    restart: always
    depends_on:
      - php-fpm
    networks:
      default: {}
      traefik-public: {}
    volumes:
      - ../app:/var/www/{! $code_name !}
      - ./docker/nginx/configs/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/var:/var/log/nginx
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.{! $code_name !}.rule: Host(`{! $site_domain !}`)
      traefik.http.routers.{! $code_name !}.entrypoints: websecure
      traefik.http.routers.{! $code_name !}.tls: "true"
      traefik.http.services.{! $code_name !}.loadbalancer.server.port: "80"

  # ---------------------------------------------------------------------------
  # PHP-FPM Settings
  # ---------------------------------------------------------------------------
  php-fpm:
    hostname: {! $code_name !}-php-fpm
    build: ./docker/php-fpm/
    restart: always
    volumes:
      - ../:/workspace
      - ../app:/var/www/{! $code_name !}
      - work4ut:/workspace/tests/work
      - ./docker/php-fpm/configs/php.ini:/usr/local/etc/php/php.ini
      - ./docker/php-fpm/configs/mailpit.ini:/usr/local/etc/php/conf.d/mailpit.ini
      - ./docker/php-fpm/configs/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      #{%-- if $use_db && $database == 'sqlite' -%}
      - db:/tmp/sqlite
      - db4ut:/tmp/sqlite4ut
      #{%-- endif -%}
    working_dir: /workspace

  # ---------------------------------------------------------------------------
  # Mailpit (Email Testing Tool) Settings
  # ---------------------------------------------------------------------------
  # You can access Mailpit via `https://{! $site_domain !}/mailpit/`.
  mailpit:
    hostname: {! $code_name !}-mailpit
    image: axllent/mailpit
    restart: always
    environment:
      TZ: {! $timezone !}
      MP_WEBROOT: /mailpit/
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      default: {}
      traefik-public: {}
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.{! $code_name !}-mailpit.rule: Host(`{! $site_domain !}`) && PathPrefix(`/mailpit`)
      traefik.http.routers.{! $code_name !}-mailpit.entrypoints: websecure
      traefik.http.routers.{! $code_name !}-mailpit.tls: "true"
      traefik.http.services.{! $code_name !}-mailpit.loadbalancer.server.port: "8025"

  #{%-- if $use_db -%}
  #{%-- if $database == 'sqlite' -%}
  # ---------------------------------------------------------------------------
  # SQLite 3 for Local Development Settings
  # ---------------------------------------------------------------------------
  sqlite:
    hostname: {! $code_name !}-sqlite
    build: ./docker/sqlite/
    environment:
      SQLITE_DATABASE: '{! $db_name !}.db'
      SQLITE_CREATE_TABLES: initdb.d/create_tables.sql
    volumes:
      - db:/tmp/sqlite
    tty: true

  # ---------------------------------------------------------------------------
  # SQLite 3 for Unit Test Settings
  # ---------------------------------------------------------------------------
  sqlite4ut:
    hostname: {! $code_name !}-sqlite4ut
    build: ./docker/sqlite/
    environment:
      SQLITE_DATABASE: '{! $db_name !}.db'
      SQLITE_CREATE_TABLES: initdb.d/create_tables.sql
    volumes:
      - db4ut:/tmp/sqlite
    tty: true

  #{%-- endif -%}
  #{%-- if $database == 'mysql' -%}
  # ---------------------------------------------------------------------------
  # MySQL for Local Development Settings
  # ---------------------------------------------------------------------------
  mysql:
    hostname: {! $code_name !}-mysql
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: {! $timezone !}
    volumes:
      - db:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mysql/configs:/etc/mysql/conf.d

  # ---------------------------------------------------------------------------
  # MySQL for Unit Test Settings
  # ---------------------------------------------------------------------------
  mysql4ut:
    hostname: {! $code_name !}-mysql4ut
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: {! $timezone !}
    volumes:
      - db4ut:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mysql/configs:/etc/mysql/conf.d

  #{%-- endif -%}
  #{%-- if $database == 'mariadb' -%}
  # ---------------------------------------------------------------------------
  # MariaDB for Local Development Settings
  # ---------------------------------------------------------------------------
  mariadb:
    hostname: {! $code_name !}-mariadb
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      TZ: {! $timezone !}
    volumes:
      - db:/var/lib/mysql
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mariadb/configs:/etc/mysql/conf.d

  # ---------------------------------------------------------------------------
  # MariaDB for Unit Test Settings
  # ---------------------------------------------------------------------------
  mariadb4ut:
    hostname: {! $code_name !}-mariadb4ut
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      TZ: {! $timezone !}
    volumes:
      - db4ut:/var/lib/mysql
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mariadb/configs:/etc/mysql/conf.d

  #{%-- endif -%}
  #{%-- if $database == 'pgsql' -%}
  # ---------------------------------------------------------------------------
  # PostgreSQL for Local Development Settings
  # ---------------------------------------------------------------------------
  pgsql:
    hostname: {! $code_name !}-pgsql
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: {! $timezone !}
    volumes:
      - db:/var/lib/postgresql/data
      - ./docker/pgsql/initdb.d:/docker-entrypoint-initdb.d

  # ---------------------------------------------------------------------------
  # PostgreSQL for Unit Test Settings
  # ---------------------------------------------------------------------------
  pgsql4ut:
    hostname: {! $code_name !}-pgsql4ut
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: {! $timezone !}
    volumes:
      - db4ut:/var/lib/postgresql/data
      - ./docker/pgsql/initdb.d:/docker-entrypoint-initdb.d

  #{%-- endif -%}
  #{%-- if $database != 'sqlite' -%}
  # ---------------------------------------------------------------------------
  # Adminer (Database Management Tool) Settings
  # ---------------------------------------------------------------------------
  # You can access Adminer via `https://{! $site_domain !}/adminer/`.
  adminer:
    hostname: {! $code_name !}-adminer
    image: adminer:latest
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: "{! $database !}"
      ADMINER_DESIGN: hever        # see https://www.adminer.org/#extras, https://github.com/vrana/adminer/tree/master/designs
      ADMINER_PLUGINS: enum-option # see https://www.adminer.org/en/plugins/
    networks:
      default: {}
      traefik-public: {}
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.{! $code_name !}-adminer.rule: Host(`{! $site_domain !}`) && PathPrefix(`/adminer`)
      traefik.http.routers.{! $code_name !}-adminer.entrypoints: websecure
      traefik.http.routers.{! $code_name !}-adminer.tls: "true"
      traefik.http.routers.{! $code_name !}-adminer.middlewares: {! $code_name !}-adminer-stripprefix
      traefik.http.middlewares.{! $code_name !}-adminer-stripprefix.stripprefix.prefixes: /adminer
      traefik.http.services.{! $code_name !}-adminer.loadbalancer.server.port: "8080"

  #{%-- endif -%}
  #{%-- endif -%}
  #{%-- if $use_cache -%}
  #{%-- if $cache == 'memcached' -%}
  # ---------------------------------------------------------------------------
  # Memcached for Cache Store Settings
  # ---------------------------------------------------------------------------
  # NOTE: The memcached for the cache store and the session storage are separated, since they
  #       have different purposes (ex. evicting cache items does not have to affect sessions).
  memcached-cache:
    hostname: {! $code_name !}-memcached-cache
    image: memcached
    restart: always

  #{%-- endif -%}
  #{%-- if $cache == 'redis' -%}
  # ---------------------------------------------------------------------------
  # Redis Settings
  # ---------------------------------------------------------------------------
  redis:
    hostname: {! $code_name !}-redis
    image: redis
    restart: always

  #{%-- endif -%}
  #{%-- endif -%}
  #{%-- if $session == 'memcached' -%}
  # ---------------------------------------------------------------------------
  # Memcached for Session Storage Settings
  # ---------------------------------------------------------------------------
  memcached-session:
    hostname: {! $code_name !}-memcached-session
    image: memcached
    restart: always

  #{%-- endif -%}
